# Netlify configuration, documented as the fallback host in DEPLOY.md.
# Regenerated by scripts/generate-headers.mjs; the CSP hashes below come from
# the built output and change whenever an inline script does.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'sha256-vGkS4FYbkCl+5Rkxl28ZN3zHSH/Hlu5DwhjyaX8mPgs=' 'sha256-uO3p9mmB5Pt/lnY5KPQWxIRUgL8hzZSRuifNHNKwfzg=' 'sha256-5d1qbRA5UZy76m5MnxbxFPF8YcJ/6fBpRQeGyJBPHoA='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
